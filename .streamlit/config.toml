# Streamlit configuration — high-contrast light "research report" theme +
# Community Cloud server defaults.
# See https://docs.streamlit.io/develop/api-reference/configuration

[theme]
base = "light"
primaryColor = "#0b5cad"            # research-report accent blue
backgroundColor = "#ffffff"         # crisp white app background
secondaryBackgroundColor = "#f6f8fa"  # card / sidebar panel
textColor = "#111111"               # near-black high-legibility text
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true         # CSRF protection (keeps CORS enabled)
maxUploadSize = 25                  # MB — IBKR exports are small

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "viewer"
